[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gil-polinrider-guard"
version = "0.1.0"
description = "Detection tooling for the PolinRider DPRK-linked supply-chain campaign (invisible Unicode, font-file masquerade, TasksJacker, ForceMemo git backdating)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
polinrider-scan-unicode = "polinrider_guard.scan_unicode:main"
polinrider-scan-masquerade = "polinrider_guard.scan_masquerade:main"
polinrider-scan-vscode = "polinrider_guard.scan_vscode:main"
polinrider-scan-git-dates = "polinrider_guard.scan_git_dates:main"
polinrider-scan-ioc = "polinrider_guard.scan_ioc:main"
polinrider-guard = "polinrider_guard.guard:main"

[tool.setuptools.packages.find]
include = ["polinrider_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
